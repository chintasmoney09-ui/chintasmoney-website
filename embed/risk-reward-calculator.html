<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Risk-Reward Calculator — ChintasMoney</title>
  <meta name="robots" content="noindex, follow" />
  <style>
    :root { --ink:#0f1730; --muted:#5b6b8c; --line:#e3e8f2; --bg:#f7f9fc; --card:#fff; --green:#12b39a; --green2:#22e08a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); padding: 14px; }
    .wrap { max-width: 460px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    .hd { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
    .hd h1 { font-size: 1.05rem; margin: 0; font-weight: 800; }
    .hd .dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--green2), var(--green)); flex: 0 0 auto; }
    .fld { display: flex; flex-direction: column; gap: 4px; margin: 0 0 10px; }
    .fld span { font-size: .78rem; color: var(--muted); font-weight: 600; }
    .fld input, .fld select { font-size: 1rem; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); width: 100%; }
    .fld input:focus, .fld select:focus { outline: none; border-color: var(--green); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .full { grid-column: 1 / -1; }
    .out { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 4px; }
    .tile { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
    .tile.key { border-color: var(--green); background: rgba(18,179,154,.07); }
    .tile .k { font-size: .7rem; color: var(--muted); }
    .tile .v { font-size: 1.15rem; font-weight: 800; }
    .tile.key .v { color: var(--green); font-size: 1.4rem; }
    .msg { font-size: .85rem; color: var(--muted); grid-column: 1 / -1; }
    .foot { margin: 12px 0 0; text-align: center; font-size: .78rem; }
    .foot a { color: var(--green); font-weight: 700; text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hd"><span class="dot"></span><h1>Risk-Reward Calculator</h1></div>
    <div class="grid">
      <label class="fld full"><span>Direction</span><select id="dir"><option value="long">Long (buy)</option><option value="short">Short (sell)</option></select></label>
      <label class="fld"><span>Entry price (₹)</span><input id="entry" type="number" value="100" inputmode="decimal" /></label>
      <label class="fld"><span>Stop-loss price (₹)</span><input id="sl" type="number" value="95" inputmode="decimal" /></label>
      <label class="fld full"><span>Target price (₹)</span><input id="tgt" type="number" value="110" inputmode="decimal" /></label>
    </div>
    <div class="out" id="out"></div>
    <p class="foot">⚡ Free calculator by <a href="https://chintasmoney.com/risk-reward-calculator?utm_source=embed&utm_medium=widget" target="_blank" rel="noopener">ChintasMoney — the Trader Report Card</a></p>
  </div>
  <script>
    (function () {
      function n(id) { var x = parseFloat(document.getElementById(id).value); return isNaN(x) ? 0 : x; }
      function money(v) { v = Math.round(v * 100) / 100; return "₹" + Math.abs(v).toLocaleString("en-IN"); }
      function run() {
        var dir = document.getElementById("dir").value, entry = n("entry"), sl = n("sl"), tgt = n("tgt");
        var out = document.getElementById("out");
        var risk = dir === "long" ? entry - sl : sl - entry;
        var reward = dir === "long" ? tgt - entry : entry - tgt;
        if (risk <= 0 || reward <= 0) { out.innerHTML = '<div class="msg">Check your prices: for a long, stop below entry and target above. For a short, the opposite.</div>'; return; }
        var rr = Math.round(reward / risk * 100) / 100;
        var breakeven = Math.round(100 / (1 + reward / risk));
        out.innerHTML =
          '<div class="tile"><div class="k">You risk</div><div class="v">' + money(risk) + '/sh</div></div>' +
          '<div class="tile"><div class="k">You aim to make</div><div class="v">' + money(reward) + '/sh</div></div>' +
          '<div class="tile key"><div class="k">Risk : Reward</div><div class="v">1 : ' + rr + '</div></div>' +
          '<div class="tile"><div class="k">Breakeven win-rate</div><div class="v">' + breakeven + '%</div></div>';
      }
      ["dir", "entry", "sl", "tgt"].forEach(function (id) { var el = document.getElementById(id); el.addEventListener("input", run); el.addEventListener("change", run); });
      run();
    })();
  </script>
</body>
</html>
