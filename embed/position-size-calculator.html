<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Position Size Calculator — ChintasMoney</title>
  <meta name="robots" content="noindex, follow" />
  <style>
    :root { --ink:#0f1730; --muted:#5b6b8c; --line:#e3e8f2; --bg:#f7f9fc; --card:#fff; --green:#12b39a; --green2:#22e08a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); padding: 14px; }
    .wrap { max-width: 460px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    .hd { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
    .hd h1 { font-size: 1.05rem; margin: 0; font-weight: 800; }
    .hd .dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--green2), var(--green)); flex: 0 0 auto; }
    .fld { display: flex; flex-direction: column; gap: 4px; margin: 0 0 10px; }
    .fld span { font-size: .78rem; color: var(--muted); font-weight: 600; }
    .fld input { font-size: 1rem; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); width: 100%; }
    .fld input:focus { outline: none; border-color: var(--green); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .out { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 4px; }
    .tile { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
    .tile.key { border-color: var(--green); background: rgba(18,179,154,.07); }
    .tile .k { font-size: .7rem; color: var(--muted); }
    .tile .v { font-size: 1.15rem; font-weight: 800; }
    .tile.key .v { color: var(--green); font-size: 1.4rem; }
    .foot { margin: 12px 0 0; text-align: center; font-size: .78rem; }
    .foot a { color: var(--green); font-weight: 700; text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hd"><span class="dot"></span><h1>Position Size Calculator</h1></div>
    <div class="grid">
      <label class="fld"><span>Trading capital (₹)</span><input id="cap" type="number" value="100000" inputmode="decimal" /></label>
      <label class="fld"><span>Risk per trade (%)</span><input id="rp" type="number" value="1" step="0.5" inputmode="decimal" /></label>
      <label class="fld"><span>Entry price (₹)</span><input id="entry" type="number" value="500" inputmode="decimal" /></label>
      <label class="fld"><span>Stop-loss price (₹)</span><input id="sl" type="number" value="490" inputmode="decimal" /></label>
    </div>
    <div class="out" id="out"></div>
    <p class="foot">⚡ Free calculator by <a href="https://chintasmoney.com/position-size-calculator?utm_source=embed&utm_medium=widget" target="_blank" rel="noopener">ChintasMoney — the Trader Report Card</a></p>
  </div>
  <script>
    (function () {
      function n(id) { var x = parseFloat(document.getElementById(id).value); return isNaN(x) ? 0 : x; }
      function money(v) { v = Math.round(v); return "₹" + Math.abs(v).toLocaleString("en-IN"); }
      function run() {
        var cap = n("cap"), rp = n("rp"), entry = n("entry"), sl = n("sl");
        var riskAmt = cap * rp / 100;
        var perShare = Math.abs(entry - sl);
        var out = document.getElementById("out");
        if (!perShare) { out.innerHTML = '<div class="tile" style="grid-column:1/-1"><div class="k">Enter an entry and a different stop-loss to see your position size.</div></div>'; return; }
        var qty = Math.floor(riskAmt / perShare);
        var deploy = qty * entry;
        out.innerHTML =
          '<div class="tile"><div class="k">You risk</div><div class="v">' + money(riskAmt) + '</div></div>' +
          '<div class="tile"><div class="k">Risk / share</div><div class="v">' + money(perShare) + '</div></div>' +
          '<div class="tile key"><div class="k">Quantity to trade</div><div class="v">' + qty.toLocaleString("en-IN") + '</div></div>' +
          '<div class="tile"><div class="k">Capital deployed</div><div class="v">' + money(deploy) + '</div></div>';
      }
      ["cap", "rp", "entry", "sl"].forEach(function (id) { document.getElementById(id).addEventListener("input", run); });
      run();
    })();
  </script>
</body>
</html>
